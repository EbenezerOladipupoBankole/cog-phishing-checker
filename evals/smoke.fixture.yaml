# Smoke fixture: the declared pair of (input, mechanical expectations).
# Run with: pixi run eval
name: smoke
bundle: examples/sample-bundle.json
expect:
  error: false
  parsed: true
  abstained: false
  required_keys: [entries, risk_level, advice]
  # A plain PayPal look-alike: a usable answer rates it high, finds several
  # signs, and every quote is grounded in the email.
  fields:
    risk_level: high
  min_entries: 3
  categories_include: [sensitive_request, suspicious_link]
  grounded: true
  forbid_tokens: []
